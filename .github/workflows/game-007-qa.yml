name: GAME-007 Visual Web QA
on:
  push:
    branches: [release/game007-visual, main]
    paths: ['game-007/**', '.github/workflows/game-007-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run actual browser and mobile smoke tests
        run: |
          python3 -m http.server 8765 --directory . > /tmp/yimma-http.log 2>&1 &
          sleep 2
          node --check game-007/tests/web_smoke.mjs
          node game-007/tests/web_smoke.mjs
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yimma-game007-browser-evidence
          path: game-007/qa-screenshots/*.png
          if-no-files-found: warn
