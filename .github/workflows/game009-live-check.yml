name: GAME-009 Live Pages Acceptance
on:
  workflow_run:
    workflows: ["Deploy Yimma Ekhtalat to GitHub Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Verify latest playable release and retained previous edition
        run: |
          python3 - <<'PY'
          import time,urllib.request
          base='https://invinciblegames.github.io/yimma-ekhtalat/'
          checks={
            '': ['latest/'],
            'latest/': ['يمّه اختلط!', 'data:image/', 'game'],
            'final/': ['يمّه اختلط!'],
            'final/game.js': ['YimmaQA'],
          }
          for path,needles in checks.items():
              last=None
              for attempt in range(15):
                  try:
                      url=base+path
                      req=urllib.request.Request(url,headers={'User-Agent':'InvincibleGames-Release-QA'})
                      with urllib.request.urlopen(req,timeout=20) as resp:
                          data=resp.read().decode('utf-8')
                          resolved=resp.url
                      if path=='':
                          assert 'latest/' in resolved or 'latest/' in data, 'root not linked to latest'
                      else:
                          assert all(token in data for token in needles), 'release content mismatch '+path
                      print('LIVE PASS',path or 'root',len(data),resolved)
                      break
                  except Exception as exc:
                      last=exc
                      time.sleep(5)
              else:
                  raise SystemExit('LIVE FAIL '+path+' '+str(last))
          print('PASS: new latest public game, main route and retained old game')
          PY
