name: Verify GAME-006 browser playtest
on:
  push:
    branches: [main]
    paths:
      - 'game-006/**'
      - '.github/workflows/game-006-web-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML and embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('game-006/index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m, 'Embedded game script missing'
          Path('/tmp/game006.js').write_text(m.group(1),encoding='utf-8')
          assert 'id="levels"' in s, 'Level navigation missing'
          assert s.count('types:[')==5, 'Five world definitions not found'
          assert 'Math.floor((g.x-20)/214)' in s, 'Five basket routing missing'
          assert "localStorage.setItem" in s, 'Saved progress missing'
          assert 'pointerdown' in s and 'pointermove' in s, 'Touch controls missing'
          print('PASS: GAME-006 HTML structure, five worlds and touch gameplay paths')
          PY
          node --check /tmp/game006.js
      - name: Confirm original homepage preserved
        run: test -s index.html && test -s menu_art.svg
