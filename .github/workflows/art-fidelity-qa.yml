name: ART-010 Complete Item Fidelity QA
on:
  push:
    branches: [feat/complete-asset-fidelity-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test entire 25-stage game and all 23 new artwork files
        run: |
          python3 -m http.server 8977 --directory . >/tmp/art010-http.log 2>&1 &
          sleep 2
          node qa/art-fidelity-smoke.cjs
      - name: Archive real desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ART010-23-Objects-Five-Worlds-Desktop-Mobile-Evidence
          path: qa/art-fidelity/*.png
          if-no-files-found: warn
